<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script src="config.js"></script>
<script src="simulation.js"></script>
<script src="render.js"></script>
<script>
const cfg = CONFIG;
const sim = createSim(cfg);
const draw = makeDraw();
const c = document.createElement('canvas');
c.width = 1600; c.height = 1000;
document.body.style.margin = '0';
document.body.style.background = '#0c1016';
document.body.appendChild(c);
draw.setup(c);
// Advance to 11:30 (peak sun, most sheep out, some full) - ~5.5 sim-hours
advance(sim, 5.5 * 3600, 1);
draw.draw(sim);
console.log('SCREENSHOT-READY states=', sim.sheep.map(s=>s.name+':'+s.state+':'+s.soc.toFixed(2)).join(' '));
</script>
</body>
</html>
