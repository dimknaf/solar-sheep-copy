<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar Sheep</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: #0c1016; color: #e8ecf2;
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  display: flex; flex-direction: column; overflow: hidden;
}
header {
  display: flex; align-items: center; gap: 16px;
  padding: 10px 16px; background: #111722; border-bottom: 1px solid #1f2937;
}
.brand { font-weight: 700; font-size: 16px; letter-spacing: .3px; color: #ffd166; white-space: nowrap; }
.brand small { color: #5c6b80; font-weight: 400; margin-left: 6px; }
.clock { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 96px; text-align: center; }
.speed { display: flex; gap: 4px; }
.spd {
  background: #1b2331; color: #cfd6e0; border: 1px solid #2a3547;
  border-radius: 8px; padding: 4px 10px; cursor: pointer; font: inherit; font-size: 13px;
}
.spd:hover { background: #232e40; }
.spd.active { background: #ffd166; border-color: #ffd166; color: #171717; font-weight: 700; }
.totals { margin-left: auto; display: flex; gap: 16px; font-size: 13px; color: #9fb0c3; white-space: nowrap; }
.totals b { color: #80ed99; font-variant-numeric: tabular-nums; }
#details { background: #151d2b; border-radius: 10px; padding: 10px 12px; display: none; }
#details:empty { display: none; }
#details:has(h3) { display: block; }
#details h3 { margin-bottom: 6px; font-size: 13px; text-transform: none; letter-spacing: 0; color: #ffd166; }
.kv { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-bottom: 1px solid #1a2436; font-size: 13px; }
.kv:last-of-type { border-bottom: none; }
.kv span { color: #9fb0c3; }
.kv b { color: #e8ecf2; font-variant-numeric: tabular-nums; font-weight: 600; }
.kv b.good { color: #80ed99; }
main { flex: 1; display: flex; min-height: 0; }
#stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 14px; min-width: 0; }
#scene {
  width: 100%; height: 100%;
  max-width: calc((100vh - 90px) * 1.6);
  border-radius: 14px; box-shadow: 0 10px 44px rgba(0,0,0,.55);
  cursor: pointer; background: #6f9e52;
}
aside {
  width: 336px; background: #111722; border-left: 1px solid #1f2937;
  padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px;
}
section h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: #8fa0b5; margin-bottom: 8px; }
#chart { width: 100%; border-radius: 8px; display: block; }
.chartnow { margin-top: 6px; font-size: 12px; color: #9fb0c3; }
.chartnow b { color: #80ed99; }
#list { display: flex; flex-direction: column; gap: 4px; }
.row {
  display: grid; grid-template-columns: 9px 58px 1fr 58px; gap: 9px; align-items: center;
  background: #151d2b; padding: 6px 9px; border-radius: 8px; cursor: pointer; font-size: 12.5px;
}
.row:hover { background: #1a2436; }
.row.sel { outline: 1px solid #ffd166; }
.row .dot { width: 9px; height: 9px; border-radius: 50%; }
.row .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .st { color: #8fa0b5; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .bar { height: 5px; background: #0b0f16; border-radius: 3px; overflow: hidden; grid-column: 2 / 4; }
.row .bar i { display: block; height: 100%; border-radius: 3px; }
.row .wh { text-align: right; color: #cfd6e0; font-variant-numeric: tabular-nums; }
label { display: flex; align-items: center; gap: 10px; margin: 9px 0; font-size: 13px; color: #cfd6e0; }
label span { min-width: 64px; text-align: right; color: #ffd166; font-variant-numeric: tabular-nums; }
input[type=range] { flex: 1; accent-color: #ffd166; }
.primary {
  width: 100%; margin-top: 10px; background: #ffd166; color: #171717; font-weight: 700;
  border: none; border-radius: 9px; padding: 9px; cursor: pointer; font: inherit; font-size: 13.5px;
}
.primary:hover { background: #ffdd88; }
.hint { color: #5c6b80; font-size: 12px; }
footer { color: #46536a; font-size: 11.5px; margin-top: auto; }
kbd { background: #1b2331; border: 1px solid #2a3547; border-radius: 4px; padding: 0 5px; font: 11px system-ui; }
</style>
</head>
<body>
<header>
  <div class="brand">Solar Sheep <small>autopilot panels</small></div>
  <div class="clock" id="clock">Day 1 - 06:30</div>
  <div class="speed">
    <button class="spd" data-speed="0" title="pause">pause</button>
    <button class="spd" data-speed="1">1x</button>
    <button class="spd" data-speed="10">10x</button>
    <button class="spd" data-speed="30">30x</button>
    <button class="spd" data-speed="100">100x</button>
    <button class="spd" id="skip" title="jump ahead 1 hour">+1h</button>
  </div>
  <div class="totals">
    <span>harvested <b id="t-har">0 Wh</b></span>
    <span>to grid <b id="t-del">0 Wh</b></span>
    <span>eff <b id="t-eff">-</b></span>
  </div>
</header>
<main>
  <div id="stage"><canvas id="scene"></canvas></div>
  <aside>
    <section>
      <h3>Grid power - last 24h</h3>
      <canvas id="chart" width="320" height="130"></canvas>
      <div class="chartnow">delivering now: <b id="gnow">0</b> W</div>
    </section>
    <section>
      <h3>Herd - Wh delivered today</h3>
      <div id="list"></div>
    </section>
    <section id="details"></section>
    <section>
      <h3>Tuning</h3>
      <label>sheep <input type="range" id="s-count" min="1" max="12" step="1" value="5"><span id="v-count">5</span></label>
      <label>battery <input type="range" id="s-batt" min="100" max="2000" step="50" value="500"><span id="v-batt">500 Wh</span></label>
      <label>panel <input type="range" id="s-panel" min="50" max="600" step="10" value="200"><span id="v-panel">200 W</span></label>
      <button class="primary" id="apply">Apply and restart sim</button>
    </section>
    <footer>click a sheep (or the warehouse) for live details &middot; <kbd>space</kbd> pause/resume</footer>
  </aside>
</main>
<script src="config.js"></script>
<script src="simulation.js"></script>
<script src="render.js"></script>
<script src="main.js"></script>
</body>
</html>
